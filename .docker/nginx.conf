server {
    listen 80;
    server_name localhost;
    
    # Professional Security Tweaks
    autoindex off;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.landingpage.app.br; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://wa.me https://api.whatsapp.com https://upload.wikimedia.org; connect-src 'self' https://wa.me https://api.whatsapp.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://www.google.com https://maps.google.com;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Midia enviada pelo painel. Location propria porque, ao contrario do
    # conteudo, esses arquivos tem nome opaco e nunca mudam -- podem cachear.
    # O `^~` impede que a regra regex de assets estaticos abaixo roube
    # /api/uploads/foto.jpg e tente servir do disco do nginx.
    # O Cache-Control vem do proprio Express (30d, immutable), para nao duplicar.
    location ^~ /api/uploads/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # Envio de midia pelo painel. O padrao do nginx e 1 MB, o que barraria um
    # video antes de ele chegar na API. Fica um pouco acima do limite de 25 MB
    # da API, para que o erro amigavel venha do backend e nao um 413 cru.
    location = /api/upload {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 30m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy para o backend do painel de edicao (servico `api` no compose).
    # Comunicacao interna da rede do Docker: nao passa pelo Nginx Proxy Manager.
    location ^~ /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conteudo do painel nunca deve ser cacheado.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        # Security headers for static files
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
