services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: dois90-pizzaria
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ./server
    container_name: dois90-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/content.db
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    volumes:
      # Volume nomeado: o SQLite sobrevive a rebuild/recreate dos containers.
      - dois90-db-data:/data
      # Os snapshots caem num diretorio normal do host, para que cron e rclone
      # alcancem sem precisar entrar no container.
      - ./backups:/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  dois90-db-data:
